<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/modal.css">
    <title>Sistema de cadastro</title>
  </head>
  <body>
    <nav id="nav_bar">
      <h1>Cadastro de Clientes</h1>
    </nav>

    <main>
      <div id="barra-ferramentas">
         <div id="campo-busca">
          <span id="icon-busca">⌕</span>
          <input type="text" id="busca" placeholder="Buscar por nome ou cidade..." />
        </div>
        <button id="cadastrar_client">Cadastrar Cliente</button>
      </div>

      <div id="content-modal">
        <div id="modal">
          <button id="fechar">X</button>
          
          <p id="modal-titulo">Novo cliente</p>
          <!--começo dos inputs do cliente-->

          <div class="input-group">
            <input type="text" id="nome" placeholder="João Silva" required />
            <label for="nome">Nome</label>
            <span class="mens-error"></span>
          </div>

          <div class="input-group">
            <input type="email" id="email" placeholder="joao@exemplo.com" required />
            <label for="email">E-mail</label>
            <span class="mens-error"></span>
          </div>

          <div class="input-group">
            <input type="tel" id="telefone" placeholder="(11) 91234-5678" inputmode="numeric" required  />
            <label for="telefone">Telefone</label>
            <span class="mens-error"></span>
          </div>

          <div class="input-group">
            <input type="text" id="cidade" placeholder="São Paulo" required />
            <label for="cidade">Cidade</label>
            <span class="mens-error"></span>
          </div>

         <div class="modal-footer">
            <button id="cancelar">Cancelar</button>
            <input type="submit" id="enviar" value="Salvar" />
          </div>

          <!--fim dos inputs do cliente-->
        </div>
      </div>

      <aside id="cabecalho">
        <div class="coluna"><h3>Nome</h3></div>
        <div class="coluna"><h3>E-mail</h3></div>
        <div class="coluna"><h3>Telefone</h3></div>
        <div class="coluna"><h3>Cidade</h3></div>
        <div class="coluna"><h3>Ação</h3></div>
      </aside>

      <aside id="tab-clientes"></aside>
    </main>

    <script type="module" src="src/index.js"></script>
  </body>
</html>
